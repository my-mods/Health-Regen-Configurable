[Mod]
Id = oOCamilleOo_HealthRegeneration
Name = Health Regeneration
Author = oOCamilleOo
Version = 0.0.0
AuthorURL = https://www.nexusmods.com/users/933214
Description = Human and vampire regeneration. On first install, load a save once to create preferences. Apply changes, then load a save.

[Setting.vampireRegenPercent]
Id = vampireRegenPercent
Label = Vampire regeneration per second
Description = Percentage of total blood capacity restored each second. Zero disables the added vampire regeneration. Apply, then load a save.
Type = picker
PresetValues = 0|0.25|0.5|0.75|1|1.25|1.5|1.75|2|2.5|3|3.5|4|4.5|5
PresetLabels = 0%|0.25%|0.5%|0.75%|1%|1.25%|1.5%|1.75%|2%|2.5%|3%|3.5%|4%|4.5%|5%
Default = 1.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vampireRegenPercent

[Setting.humanRegenPercent]
Id = humanRegenPercent
Label = Human regeneration per second
Description = Percentage of maximum human health restored each second. Zero disables the added human regeneration. Apply, then load a save.
Type = picker
PresetValues = 0|0.25|0.5|0.75|1|1.25|1.5|1.75|2|2.5|3|3.5|4|4.5|5
PresetLabels = 0%|0.25%|0.5%|0.75%|1%|1.25%|1.5%|1.75%|2%|2.5%|3%|3.5%|4%|4.5%|5%
Default = 1.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = humanRegenPercent

[Setting.combatRegen]
Id = combatRegen
Label = Combat regeneration
Description = Off: regenerate only outside combat. On: also regenerate during combat. Applies to both forms. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = combatRegen

[Setting.restoreVampireSegments]
Id = restoreVampireSegments
Label = Restore vampire segments
Description = Off: stop at the current recoverable segment ceiling. On: allow regeneration to restore lost segments and continue toward full health. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = restoreVampireSegments

[Setting.debugLogging]
Id = debugLogging
Label = Logging
Description = Log settings application and diagnostics to UE4SS.log. Leave Off for normal play. Apply, then load a save.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
